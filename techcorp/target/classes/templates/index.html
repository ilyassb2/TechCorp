<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>TechCorp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h2>Event Log</h2>

        <ul class="event-log">
            <li th:each="event : ${eventLog}">
                <span th:text="${event}"></span>
            </li>
        </ul>

        <form th:if="${gameStarted}" th:action="@{/restart}" method="post">
            <button class="secondary-button" type="submit">New Game</button>
        </form>

    </aside>

    <main class="main-content">

        <h1>TechCorp Simulator</h1>

        <div th:if="${!gameStarted}" class="start-panel">

            <h2>Choose Difficulty</h2>

            <form th:action="@{/start-game}" method="post">

                <select name="selectedDifficulty" required>
                    <option value="EASY">Easy</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HARD">Hard</option>
                </select>

                <button type="submit">Start Game</button>

            </form>

        </div>

        <div th:if="${gameStarted}">

            <div class="top-info">
                <span>Difficulty: <strong th:text="${difficulty}"></strong></span>
                <span th:if="${gameResult}" class="game-result" th:text="${gameResult}"></span>
            </div>

            <div class="message-popup" th:if="${message}">
                <span th:text="${message}"></span>
            </div>

            <section class="battle-board">

                <div class="company-card player-card">

                    <h2>PLAYER</h2>
                    <h3 th:text="${companyName}"></h3>

                    <div class="cash" th:text="${cash}"></div>
                    <p class="label">Cash</p>

                    <div class="project-box">
                        <p th:text="${projectName}"></p>
                        <div class="progress-text">
                            <span th:text="${projectProgress}"></span>
                            /
                            <span th:text="${requiredWork}"></span>
                        </div>
                    </div>

                    <h4>Employees</h4>
                    <ul class="employees">
                        <li th:each="employee, stat : ${employees}">
                            <span th:text="${employee.getName()}"></span>
                        </li>
                    </ul>

                </div>

                <div class="company-card opponent-card">

                    <h2>OPPONENT</h2>
                    <h3 th:text="${opponentName}"></h3>

                    <div class="cash" th:text="${opponentCash}"></div>
                    <p class="label">Cash</p>

                    <div class="project-box">
                        <p th:text="${opponentProjectName}"></p>
                        <div class="progress-text">
                            <span th:text="${opponentProjectProgress}"></span>
                            /
                            <span th:text="${opponentRequiredWork}"></span>
                        </div>
                    </div>

                    <h4>Employees</h4>
                    <ul class="employees">
                        <li th:each="employee : ${opponentEmployees}">
                            <span th:text="${employee.getName()}"></span>
                        </li>
                    </ul>

                </div>

            </section>

            <section class="actions-panel" th:if="${!gameOver}">

                <form class="hire-form" th:action="@{/hire}" method="post">

                    <input type="text" name="name" placeholder="Employee name" required>

                    <select name="role" required>
                        <option value="DataEngineer">Data Engineer</option>
                        <option value="MLOpsEngineer">MLOps Engineer</option>
                        <option value="SOCAnalyst">SOC Analyst</option>
                        <option value="ProjectManager">Project Manager</option>
                    </select>

                    <button type="submit">Hire</button>

                </form>

                <form class="fire-form" th:action="@{/fire}" method="post">

                    <select name="employeeIndex" required>
                        <option
                            th:each="employee, stat : ${employees}"
                            th:value="${stat.index}"
                            th:text="${employee.getName()}">
                        </option>
                    </select>

                    <button type="submit">Fire</button>

                </form>

                <form th:action="@{/next-turn}" method="post">
                    <button class="primary-action" type="submit">Next Turn</button>
                </form>

            </section>

        </div>

    </main>

</div>

</body>
</html>
